name: Release

# Runs when you publish a GitHub Release. Builds the app for Windows (portable
# .exe + Inno Setup installer), Linux (.deb, .rpm, Arch .pkg.tar.zst, a Flatpak
# bundle, and an AppImage — the last four all x86_64 + arm64), and macOS (.dmg,
# arm64 + x86_64), and attaches every artifact to the release that triggered the
# run. Jobs are independent: a failing packager attaches nothing but never
# blocks the release or the other packages.
#
# Icons are committed, pre-rendered from icon.svg by tools/generate-icons.bat
# (run once at dev time). icon.svg uses an SVG mesh gradient that headless CLI
# rasterizers can't render, so CI does NOT rasterize the SVG — it consumes the
# committed icon/icon.ico and icon/icon<size>.png files directly.
on:
  release:
    types: [published]

# Needed so the workflow can upload the built artifacts back onto the release.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Release-mode tests so the optimized build below reuses these artifacts.
      # build.rs embeds the committed icon/icon.ico into the .exe via winres.
      - name: Run tests
        run: cargo test --workspace --release

      # Windows ships the wgpu (DX12) backend. Pinned explicitly rather than
      # relying on the crate default so the per-OS split (Windows = wgpu,
      # Linux = glow, see the deb/arch jobs below) stays intentional even if
      # the default renderer feature ever changes.
      - name: Build release exe
        run: cargo build --release -p FastTIFF

      # Give the asset a versioned name
      - name: Stage artifact
        shell: bash
        run: cp target/release/FastTIFF.exe "FastTIFF.exe"

      - name: Attach exe to release
        uses: softprops/action-gh-release@v2
        with:
          files: FastTIFF.exe
          # to give versioned name:
          # files: FastTIFF-${{ github.event.release.tag_name }}.exe

      # Package the same exe into an installer (Start Menu + optional desktop
      # shortcut, .tif/.tiff "Open with" registration, uninstaller) with Inno
      # Setup — reads FastTIFF/packaging/windows/fasttiff.iss. No rebuild: it
      # bundles the FastTIFF.exe staged above. Ships alongside the portable .exe
      # so users can pick either.
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages `
            | Where-Object { $_.name -eq 'FastTIFF' } | Select-Object -ExpandProperty version
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$ver" FastTIFF\packaging\windows\fasttiff.iss

      - name: Attach installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: FastTIFF-setup.exe

  # Builds the Debian/Ubuntu .deb with cargo-deb and attaches it to the release,
  # alongside the Windows .exe above. Runs once per architecture on a native
  # runner (no cross-compiling the GTK/GL/X11 stack): ubuntu-24.04 -> x86_64,
  # ubuntu-24.04-arm -> arm64. The attached file is renamed to a stable
  # FastTIFF-<arch>.deb (the .deb's own Architecture tag stays amd64/arm64).
  build-linux-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Build-time libs the glow GUI links: GTK3 (rfd file dialog), OpenGL, and
      # the X11 / Wayland / xkbcommon stack winit needs. cargo-deb derives the
      # matching *runtime* package deps from the binary (depends = "$auto").
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      - name: Install cargo-deb
        run: cargo install cargo-deb --locked

      # Maintainer scripts are committed from Windows without the exec bit;
      # dpkg requires them executable.
      - name: Make deb maintainer scripts executable
        run: chmod 0755 FastTIFF/packaging/deb/postinst FastTIFF/packaging/deb/postrm

      # Reads [package.metadata.deb] from FastTIFF/Cargo.toml, which lists the
      # committed hicolor PNGs (icon/icon{16,32,48,64,128,256}.png) as assets.
      # Output: target/debian/fasttiff_<version>-1_<amd64|arm64>.deb (per arch).
      # Linux ships the glow (OpenGL) backend, not the crate default (wgpu):
      # OpenGL is near-universal on Linux, whereas a wgpu binary needs a Vulkan
      # ICD at runtime that cargo-deb's $auto dep scan can't see (wgpu dlopens
      # libvulkan). cargo-deb forwards these flags to the cargo build it runs.
      - name: Build .deb
        run: cargo deb -p FastTIFF --no-default-features --features renderer-glow

      # Copy to a stable, version-less name (cargo-deb bakes the version into its
      # filename) so the README can link via releases/latest/download/. The
      # package's own metadata still carries the version.
      - name: Stage stable-named .deb
        run: cp target/debian/*.deb "FastTIFF-${{ matrix.arch }}.deb"

      - name: Attach .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: FastTIFF-*.deb

  # Builds the Fedora/RHEL/openSUSE .rpm with cargo-generate-rpm (pure Rust — no
  # rpmbuild) and attaches it, mirroring the .deb job: same native runners
  # (ubuntu-24.04 -> x86_64, ubuntu-24.04-arm -> arm64), same glow backend,
  # same system build-deps. Reads [package.metadata.generate-rpm] from
  # FastTIFF/Cargo.toml. Like the .deb, it links the runner's glibc, so it
  # targets recent RPM distros.
  build-linux-rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Same build-time libs the glow GUI links as the .deb job.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      # Linux ships glow (OpenGL), same rationale as the .deb (see that job).
      # The release profile already strips the binary, which cargo-generate-rpm
      # packages as-is; auto-req still reads the ELF's NEEDED sonames.
      - name: Build release binary (glow)
        run: cargo build --release -p FastTIFF --no-default-features --features renderer-glow

      # Run from the workspace root so the metadata's root-relative asset paths
      # resolve. Output: target/generate-rpm/fasttiff-<version>-1.<arch>.rpm
      # (arch auto-detected from the binary, so the two runners don't collide).
      - name: Build .rpm
        run: cargo generate-rpm -p FastTIFF

      # Stable, version-less name for the README's latest/download/ link (the
      # RPM's own metadata still carries the version + its own arch tag).
      - name: Stage stable-named .rpm
        run: cp target/generate-rpm/*.rpm "FastTIFF-${{ matrix.arch }}.rpm"

      - name: Attach .rpm to release
        uses: softprops/action-gh-release@v2
        with:
          files: FastTIFF-*.rpm

  # Builds a pacman package (.pkg.tar.zst) from FastTIFF/packaging/arch/PKGBUILD when a
  # GitHub Release is published, and attaches it to that release — the Arch
  # counterpart to the .deb / .exe jobs in release.yml.
  #
  # Runs inside an Arch container. makepkg refuses to run as root, so it's driven
  # as an unprivileged user; every dependency is pre-installed, so makepkg needs
  # no sudo/pacman access of its own. The PKGBUILD installs the committed hicolor
  # PNGs (icon/icon<size>.png) — no SVG rasterization.
  build-arch:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      # base-devel = makepkg + fakeroot etc.; curl for the source download;
      # rust for the build; the rest are the GUI runtime libs (also the
      # PKGBUILD's depends, so makepkg's dep check passes without -s).
      - name: Install build tooling + runtime libs
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel curl git rust \
            gtk3 libglvnd libxkbcommon libx11 libxcursor libxi libxrandr wayland fontconfig

      - name: Checkout
        uses: actions/checkout@v4

      # Build exactly the released commit: pin the git source to the tag.
      # pkgver() in the PKGBUILD derives the version number from Cargo.toml.
      - name: Pin source to released tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: sed -i "s|\.git\")|.git#tag=${TAG}\")|" FastTIFF/packaging/arch/PKGBUILD

      # makepkg clones the tagged source, builds it, and packages.
      - name: Build package
        run: |
          useradd -m builder
          cp FastTIFF/packaging/arch/PKGBUILD /home/builder/PKGBUILD
          chown -R builder:builder /home/builder
          sudo -u builder bash -lc 'cd ~ && makepkg --noconfirm'

      # Stable, version-less name for the README's latest/download/ link (Arch is
      # x86_64-only here; the package metadata still carries the version).
      - name: Stage stable-named package
        run: cp /home/builder/*.pkg.tar.zst FastTIFF-x86_64.pkg.tar.zst

      - name: Attach package to release
        uses: softprops/action-gh-release@v2
        with:
          files: FastTIFF-x86_64.pkg.tar.zst

  # Builds a distributable Flatpak bundle (.flatpak) for both architectures on
  # native runners (ubuntu-24.04 -> x86_64, ubuntu-24.04-arm -> arm64) and
  # attaches it. Ships the glow (OpenGL) backend, like the other Linux packages.
  #
  # The flatpak-builder sandbox has no build-time network, so crates are vendored
  # first: flatpak-cargo-generator turns Cargo.lock into generated-sources.json,
  # which the manifest (FastTIFF/packaging/flatpak/…yml) references. The app is
  # then compiled offline inside the org.freedesktop 25.08 SDK + rust-stable
  # extension. No Rust toolchain is needed on the host — only Cargo.lock.
  build-flatpak:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flatpak + builder + generator deps
        run: |
          sudo apt-get update
          # flatpak-cargo-generator (from master) parses Cargo.lock with tomlkit
          # and fetches crate hashes with aiohttp.
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder python3-aiohttp python3-tomlkit
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      # Stamp the release version + date into the AppStream metainfo's <release>
      # entry, so it never has to be hand-edited before a release (the committed
      # value is just a placeholder — it's overwritten here). Date comes from the
      # published release, falling back to today.
      - name: Stamp version + date into the metainfo
        run: |
          VERSION="$(awk -F'"' '/^version = / {print $2; exit}' FastTIFF/Cargo.toml)"
          DATE="${{ github.event.release.published_at }}"; DATE="${DATE:0:10}"
          [ -n "$DATE" ] || DATE="$(date -u +%Y-%m-%d)"
          sed -i -E "s#<release version=\"[^\"]*\" date=\"[^\"]*\"\s*/>#<release version=\"$VERSION\" date=\"$DATE\"/>#" \
            FastTIFF/packaging/flatpak/io.github.konung_yaropolk.FastTIFF.metainfo.xml

      # Vendor every crate from Cargo.lock into generated-sources.json (offline
      # sources the manifest pulls in), next to the manifest.
      - name: Generate offline cargo sources
        run: |
          curl -sSL -o flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/master/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock \
            -o FastTIFF/packaging/flatpak/generated-sources.json

      # Keep build-dir/repo OUTSIDE the checkout: the manifest's `dir` source is
      # the repo root, so building inside it would recurse.
      - name: Build Flatpak bundle
        run: |
          set -euo pipefail
          # Stable, version-less bundle name for the README's latest/download/
          # link (the bundle's metainfo still carries the version).
          flatpak-builder --user --disable-rofiles-fuse --force-clean \
            --repo="$RUNNER_TEMP/repo" "$RUNNER_TEMP/build-dir" \
            FastTIFF/packaging/flatpak/io.github.konung_yaropolk.FastTIFF.yml
          flatpak build-bundle "$RUNNER_TEMP/repo" \
            "FastTIFF-${{ matrix.arch }}.flatpak" \
            io.github.konung_yaropolk.FastTIFF
          echo "FLATPAK_NAME=FastTIFF-${{ matrix.arch }}.flatpak" >> "$GITHUB_ENV"

      - name: Attach .flatpak to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FLATPAK_NAME }}

  # Builds a portable AppImage for both architectures (ubuntu-24.04 -> x86_64,
  # ubuntu-24.04-arm -> arm64). linuxdeploy bundles the glow binary together
  # with its shared-library dependencies (GTK3, OpenGL, X11, xkbcommon, …) into a
  # single self-contained file that runs on most modern Linux distros with
  # nothing to install. Native runners so the bundled libs match the target arch.
  build-appimage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Same build-time libs the glow GUI links as the .deb job.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      # Linux ships glow (OpenGL), same rationale as the .deb (see that job).
      - name: Build release binary (glow)
        run: cargo build --release -p FastTIFF --no-default-features --features renderer-glow

      # linuxdeploy assembles the AppDir (binary + its ldd-resolved libs +
      # AppRun) from the committed .desktop and icon, then its appimage plugin
      # packs the .AppImage. The gtk plugin additionally bundles GTK3's runtime
      # bits (gdk-pixbuf loaders, modules, GSettings schemas) that a bare
      # ldd-copy misses — needed for the rfd "Open TIFF" file dialog to work
      # inside the sandbox. (It's an arch-agnostic shell script; if it ever
      # breaks a build, dropping `--plugin gtk` still yields a launchable
      # AppImage whose dialog may not open.) APPIMAGE_EXTRACT_AND_RUN lets the
      # tools run without FUSE (unavailable on the runners); OUTPUT names the file.
      - name: Build AppImage
        run: |
          set -euo pipefail
          export APPIMAGE_EXTRACT_AND_RUN=1
          # The gtk plugin can't auto-detect the toolkit version from our binary
          # (rfd links GTK indirectly), so tell it explicitly — FastTIFF uses GTK3.
          export DEPLOY_GTK_VERSION=3
          base="https://github.com/linuxdeploy"
          # Our asset names use arm64, but linuxdeploy's own releases use the
          # kernel name aarch64 — map it just for these download URLs.
          dl_arch="${{ matrix.arch }}"
          [ "$dl_arch" = arm64 ] && dl_arch=aarch64
          curl -sSL -o linuxdeploy \
            "$base/linuxdeploy/releases/download/continuous/linuxdeploy-${dl_arch}.AppImage"
          curl -sSL -o linuxdeploy-plugin-appimage \
            "$base/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-${dl_arch}.AppImage"
          curl -sSL -o linuxdeploy-plugin-gtk \
            "$base/linuxdeploy-plugin-gtk/raw/master/linuxdeploy-plugin-gtk.sh"
          chmod +x linuxdeploy linuxdeploy-plugin-appimage linuxdeploy-plugin-gtk
          export PATH="$PWD:$PATH"   # so linuxdeploy finds the plugins
          export OUTPUT="FastTIFF-${{ matrix.arch }}.AppImage"
          ./linuxdeploy \
            --appdir AppDir \
            --executable target/release/FastTIFF \
            --desktop-file FastTIFF/packaging/fasttiff.desktop \
            --icon-file FastTIFF/icon/icon256.png \
            --icon-filename fasttiff \
            --plugin gtk \
            --output appimage
          echo "APPIMAGE_NAME=$OUTPUT" >> "$GITHUB_ENV"

      - name: Attach AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APPIMAGE_NAME }}

  # Builds the macOS .app bundle and packages it into a .dmg, then attaches it
  # to the release — the macOS counterpart to the .exe / .deb / pacman jobs above.
  # Runs once per architecture on a native runner (no cross-compiling the Metal /
  # Cocoa stack): macos-14 -> arm64 (Apple Silicon), macos-15-intel -> x86_64.
  # Apple has deprecated x86_64; macos-15-intel is the last Intel image Actions
  # offers (available through ~August 2027), so the Intel job is best-effort and
  # allowed to fail without blocking the arm64 one (fail-fast: false).
  build-macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # Pin the target so the build matches the runner's arch even if the
          # host default ever drifts (belt-and-suspenders on native runners).
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Release-mode tests so the optimized build below reuses these artifacts.
      - name: Run tests
        run: cargo test --workspace --release --target ${{ matrix.target }}

      # macOS ships the wgpu (Metal) backend, matching the crate default and the
      # Windows job. wgpu is preferred on macOS because Apple deprecated OpenGL,
      # so the glow path used for Linux is intentionally NOT used here. Pinned
      # explicitly so the per-OS renderer split stays deliberate.
      - name: Build release binary
        run: >
          cargo build --release --target ${{ matrix.target }}
          -p FastTIFF --no-default-features --features renderer-wgpu

      # Assemble FastTIFF.app by hand (no cargo-bundle dependency): synthesize an
      # Info.plist whose strings mirror [package.metadata.winres] from
      # FastTIFF/Cargo.toml, build an .icns from the COMMITTED PNGs (icon.svg
      # can't be rasterized headlessly — mesh gradient), and drop the binary in
      # MacOS/. iconutil packs the .icns from an iconset assembled by copying the
      # committed icon<size>.png files into Apple's slot names.
      - name: Build .app bundle
        shell: bash
        env:
          # Mirror of [package.metadata.winres] — edit both together.
          PRODUCT_NAME: "Fast TIFF Viewer"
          BUNDLE_ID: "com.konung-yaropolk.fasttiff"
          COPYRIGHT: "konung_yaropolk © 2026"
          DESCRIPTION: "Fast TIFF Viewer"
        run: |
          set -euo pipefail
          VERSION="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import sys,json; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="FastTIFF"))')"
          echo "Building FastTIFF.app version $VERSION for ${{ matrix.arch }}"

          APP="FastTIFF.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          # --- binary ---
          cp "target/${{ matrix.target }}/release/FastTIFF" "$APP/Contents/MacOS/FastTIFF"
          chmod +x "$APP/Contents/MacOS/FastTIFF"

          # --- icons: assemble iconsets from committed PNGs, then pack .icns ---
          # Two of them. `icon*.png` is the application, shown in the Dock and
          # in Finder for the .app itself; `icon-image-tiff*.png` is the
          # document, shown on every .tif file the app owns. macOS keeps those
          # separate (CFBundleIconFile vs the document type's
          # CFBundleTypeIconFile), and so should we — one says "this program",
          # the other says "a file this program opens".
          ICO="FastTIFF/icon"
          make_icns() {
            prefix="$1"; out="$2"
            iconset="$(mktemp -d)/icon.iconset"; mkdir -p "$iconset"
            cp "$ICO/${prefix}16.png"   "$iconset/icon_16x16.png"
            cp "$ICO/${prefix}32.png"   "$iconset/icon_16x16@2x.png"
            cp "$ICO/${prefix}32.png"   "$iconset/icon_32x32.png"
            cp "$ICO/${prefix}64.png"   "$iconset/icon_32x32@2x.png"
            cp "$ICO/${prefix}128.png"  "$iconset/icon_128x128.png"
            cp "$ICO/${prefix}256.png"  "$iconset/icon_128x128@2x.png"
            cp "$ICO/${prefix}256.png"  "$iconset/icon_256x256.png"
            cp "$ICO/${prefix}512.png"  "$iconset/icon_256x256@2x.png"
            cp "$ICO/${prefix}512.png"  "$iconset/icon_512x512.png"
            cp "$ICO/${prefix}1024.png" "$iconset/icon_512x512@2x.png"
            iconutil -c icns "$iconset" -o "$out"
            rm -rf "$iconset"
          }
          make_icns "icon"            "$APP/Contents/Resources/FastTIFF.icns"
          make_icns "icon-image-tiff" "$APP/Contents/Resources/FastTIFF-tiff.icns"

          # --- Info.plist ---
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Clear dict" "$PLIST" 2>/dev/null || true
          # `${3:-}` so container entries (array/dict) can omit the value arg
          # without tripping `set -u` ("unbound variable"); PlistBuddy ignores
          # the resulting trailing space.
          add() { /usr/libexec/PlistBuddy -c "Add $1 $2 ${3:-}" "$PLIST"; }
          add ":CFBundleName"                  string  "$PRODUCT_NAME"
          add ":CFBundleDisplayName"           string  "$PRODUCT_NAME"
          add ":CFBundleExecutable"            string  "FastTIFF"
          add ":CFBundleIdentifier"            string  "$BUNDLE_ID"
          add ":CFBundleIconFile"              string  "FastTIFF.icns"
          add ":CFBundleShortVersionString"    string  "$VERSION"
          add ":CFBundleVersion"               string  "$VERSION"
          add ":CFBundlePackageType"           string  "APPL"
          add ":CFBundleInfoDictionaryVersion" string  "6.0"
          add ":CFBundleGetInfoString"         string  "$DESCRIPTION"
          add ":NSHumanReadableCopyright"      string  "$COPYRIGHT"
          add ":LSMinimumSystemVersion"        string  "11.0"
          add ":NSHighResolutionCapable"       bool    true

          # Document types: without this Launch Services reports the app "does
          # not support" TIFFs, so Finder's "Open With" and setting FastTIFF as
          # the default TIFF app both fail. Bind to the system UTI public.tiff,
          # which already maps to both .tif and .tiff — no custom UTI/extension
          # list needed. Rank "Default" marks FastTIFF as a first-class handler
          # (it renders scientific TIFF stacks better than Preview). This does
          # NOT forcibly override an existing user default — where Preview is
          # already set, the user still picks FastTIFF via Get Info > "Change
          # All" — but it makes FastTIFF the preferred choice absent a user default.
          add ":CFBundleDocumentTypes"                        array
          add ":CFBundleDocumentTypes:0"                      dict
          add ":CFBundleDocumentTypes:0:CFBundleTypeName"     string  "TIFF image"
          add ":CFBundleDocumentTypes:0:CFBundleTypeRole"     string  "Viewer"
          # The document icon Finder draws on .tif files FastTIFF handles. Named
          # without its extension, as CFBundleTypeIconFile expects.
          add ":CFBundleDocumentTypes:0:CFBundleTypeIconFile" string  "FastTIFF-tiff"
          add ":CFBundleDocumentTypes:0:LSHandlerRank"        string  "Default"
          add ":CFBundleDocumentTypes:0:LSItemContentTypes"   array
          add ":CFBundleDocumentTypes:0:LSItemContentTypes:0" string  "public.tiff"

          plutil -lint "$PLIST"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      # Ad-hoc code-sign so the app launches on the build arch without an
      # "is damaged" Gatekeeper error from a totally unsigned bundle. This is
      # NOT notarized — end users on another Mac will still need to right-click
      # -> Open (or `xattr -dr com.apple.quarantine`) the first time. Real
      # notarization needs an Apple Developer ID cert.
      - name: Ad-hoc sign the app
        run: codesign --force --deep --sign - "FastTIFF.app"

      # Stage the .app in a clean folder with an /Applications symlink so the
      # DMG opens showing the familiar "drag to Applications" layout, then build
      # a compressed (UDZO) read-only image with hdiutil (first-party tooling).
      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          STAGE="dmg_stage"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          cp -R "FastTIFF.app" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          DMG="FastTIFF-${{ matrix.arch }}.dmg"
          rm -f "$DMG"
          hdiutil create -volname "Fast TIFF Viewer" \
            -srcfolder "$STAGE" -fs HFS+ -format UDZO -imagekey zlib-level=9 \
            "$DMG"
          echo "DMG_NAME=$DMG" >> "$GITHUB_ENV"

      - name: Attach DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.DMG_NAME }}