# Build the egui web viewer and publish it to GitHub Pages.
#
# Enable once under Settings → Pages → Source → "GitHub Actions"; after that
# every push to main redeploys. `workflow_dispatch` allows a manual run.
#
# This deploys `FastTIFF-web/` (egui/eframe on a canvas). The React build in
# `FastTIFF-web-React-frontend-example/` is still in the repo and still
# builds — to publish that one instead, see the note at the bottom of this file.
name: Deploy web viewer

on:
  push:
    branches: [main]
    # Only rebuild when something the bundle actually contains changes.
    paths:
      - "FastTIFF-web/**"
      # The shared egui UI lives in the desktop crate's library half, so the
      # deployed bundle changes when it does.
      - "FastTIFF/**"
      - "fast-tiff-lib/**"
      - "fast-tiff-viewer/**"
      - "scivis-render/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned, as ci.yml's Linux jobs are. This is the job that produces what
    # gets served, so it is the last place to want a floating image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Pinned, like every other workflow here. This job used to take whatever
      # Rust the runner image happened to ship, which is the one toolchain in
      # the repository nobody had chosen.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            FastTIFF-web/target
          key: egui-wasm-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'FastTIFF-web/Cargo.toml') }}
          restore-keys: egui-wasm-${{ runner.os }}-

      # Pinned, and the pin is the whole fix for the deploy that failed with
      # "Only 1 table definition allowed in MVP".
      #
      # With `version: latest`, this action resolves the version at job time
      # through an *unauthenticated* `GET api.github.com/.../releases/latest`
      # and then takes `JSON.parse(body).tag_name || "v0.9.1"`. A body with no
      # `tag_name` — the 60-per-hour unauthenticated rate limit on the
      # runner's shared egress address is the realistic way to get one —
      # silently installs wasm-pack **v0.9.1**, from 2020, which fetches
      # Binaryen 90. Binaryen 90 cannot represent a module with more than one
      # table at all, and `wasm-bindgen` has been adding a second one (its
      # `externref` table) ever since rustc turned `reference-types` on by
      # default for wasm32 in 1.82. Hence a deploy that breaks with no commit
      # behind it, intermittently: two runs four hours apart, identical
      # bundle inputs, one fine and one dead.
      #
      # The failing log named the binary precisely enough to identify it:
      # `~/.cache/.wasm-pack/wasm-opt-4d7a65327e9363b7`, where that suffix is
      # a hash of the download URL, and it is the hash of Binaryen 90's
      # `x86-linux` tarball — an asset name only wasm-pack 0.9.x/0.10.x ask
      # for. A good run on this runner shows `wasm-opt-1ceaaea8b7b5f7e0`,
      # Binaryen 117.
      #
      # Naming a version means the lookup never happens, so the fallback
      # cannot fire. v0.15.0 is the current release (2026-05-15) and pins
      # Binaryen 117, which parses this module.
      #
      # Caveat worth knowing: wasm-pack 0.15 prefers a `wasm-opt` already on
      # PATH over its own pinned download. Nothing here puts one there, and
      # `~/.cargo/bin` and `~/.cache/.wasm-pack` are both deliberately absent
      # from the cache below — caching the latter would have made this
      # intermittent failure permanent.
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.15.0

      - name: Build wasm
        working-directory: FastTIFF-web
        run: wasm-pack build --target web --out-dir pkg --release

      # `index.html` loads `./pkg/…` relatively, so the site works at any
      # subpath — no base-path substitution needed, unlike the Vite build.
      - name: Assemble the site
        working-directory: FastTIFF-web
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r pkg dist/pkg
          # Favicons come from the app's own icon set, so the tab icon and the
          # desktop build can never drift apart.
          cp ../FastTIFF/icon/{icon.svg,icon32.png,icon256.png} dist/
          # A small demo stack, so the page is usable without your own file.
          mkdir -p dist/samples
          cp ../fast-tiff-lib/tests/fixtures/ij_u16_spp1_p6_hyperstack.tif \
             dist/samples/hyperstack-6plane-16bit.tif

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FastTIFF-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
# ---------------------------------------------------------------------------
# To publish the React build (`FastTIFF-web-React-frontend-example/`) instead,
# point every `working-directory` below at it and swap the build steps for:
#
#   - uses: actions/setup-node@v4
#     with: { node-version: 20, cache: npm, cache-dependency-path: FastTIFF-web-React-frontend-example/package-lock.json }
#   - run: npm ci
#     working-directory: FastTIFF-web-React-frontend-example
#   - run: npm run wasm && npm run typecheck && npx vite build
#     working-directory: FastTIFF-web-React-frontend-example
#     env:
#       BASE_PATH: /${{ github.event.repository.name }}/
#
# and point `upload-pages-artifact` at `FastTIFF-web-React-frontend-example/dist`. The React app needs
# BASE_PATH because Vite rewrites asset URLs at build time; the egui one doesn't.
