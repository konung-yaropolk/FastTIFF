# Build the egui web viewer and publish it to GitHub Pages.
#
# Enable once under Settings → Pages → Source → "GitHub Actions"; after that
# every push to main redeploys. `workflow_dispatch` allows a manual run.
#
# This deploys `FastTIFF-web/` (egui/eframe on a canvas). The React build in
# `FastTIFF-web-React-frontend-example/` is still in the repo and still
# builds — to publish that one instead, see the note at the bottom of this file.
name: Deploy web viewer

on:
  push:
    branches: [main]
    # Only rebuild when something the bundle actually contains changes.
    paths:
      - "FastTIFF-web/**"
      # The shared egui UI lives in the desktop crate's library half, so the
      # deployed bundle changes when it does, and when anything under it does:
      # the built-in plugins run in the browser too.
      - "FastTIFF/**"
      - "fast-tiff-lib/**"
      - "fast-tiff-viewer/**"
      - "scivis-render/**"
      - "fasttiff-plugin-api/**"
      - "fasttiff-plugin-abi/**"
      - "suite2p-registration/**"
      - "turboreg-registration/**"
      # The web crate is a workspace member: the root lock is its lock, and the
      # root manifest holds its profile and its dependency versions.
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      # And what builds it: the shared action and the script step it calls.
      - ".github/actions/web-bundle/**"
      - "scripts/ci-local.sh"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than
# cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Pinned, as ci.yml's Linux jobs are. This is the job that produces what
    # gets served, so it is the last place to want a floating image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Pinned, like every other workflow here. This job used to take whatever
      # Rust the runner image happened to ship, which is the one toolchain in
      # the repository nobody had chosen.
      # The toolchain rust-toolchain.toml names, with the components and
      # targets it lists.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: egui-wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: egui-wasm-${{ runner.os }}-

      # The pinned wasm-pack and the build, defined once in the action and
      # shared with ci.yml's guard, which builds the same bundle on every pull
      # request. The action says why the pin matters.
      - name: Build wasm
        uses: ./.github/actions/web-bundle

      # `index.html` loads `./pkg/…` relatively, so the site works at any
      # subpath — no base-path substitution needed, unlike the Vite build.
      - name: Assemble the site
        working-directory: FastTIFF-web
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r pkg dist/pkg
          # Favicons come from the app's own icon set, so the tab icon and the
          # desktop build can never drift apart.
          cp ../FastTIFF/icon/{icon.svg,icon32.png,icon256.png} dist/
          # A small demo stack, so the page is usable without your own file.
          mkdir -p dist/samples
          cp ../fast-tiff-lib/tests/fixtures/ij_u16_spp1_p6_hyperstack.tif \
             dist/samples/hyperstack-6plane-16bit.tif

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: FastTIFF-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
# ---------------------------------------------------------------------------
# To publish the React build (`FastTIFF-web-React-frontend-example/`) instead,
# point every `working-directory` below at it and swap the build steps for:
#
#   - uses: actions/setup-node@v4
#     with: { node-version: 20, cache: npm, cache-dependency-path: FastTIFF-web-React-frontend-example/package-lock.json }
#   - run: npm ci
#     working-directory: FastTIFF-web-React-frontend-example
#   - run: npm run wasm && npm run typecheck && npx vite build
#     working-directory: FastTIFF-web-React-frontend-example
#     env:
#       BASE_PATH: /${{ github.event.repository.name }}/
#
# and point `upload-pages-artifact` at `FastTIFF-web-React-frontend-example/dist`. The React app needs
# BASE_PATH because Vite rewrites asset URLs at build time; the egui one doesn't.
