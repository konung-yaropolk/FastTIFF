name: CI

# Runs the full workspace test suite on pushes to main (and PRs targeting it),
# so the "tests" badge reflects current health between releases — not just the
# last published release. One job per OS, because each platform compiles code
# the others exclude (`#[cfg(target_os = ...)]` gates + target-gated deps in
# FastTIFF/Cargo.toml): Windows = winres build script; macOS = the
# macos_open.rs open-file FFI (+ its unit tests); Linux = the x11/wayland
# eframe features and the glow release backend. Without per-OS jobs, a break
# behind another platform's gate stays green until its release build fails.
#
# build.rs embeds the committed icon/icon.ico into the .exe via winres; the icon
# is pre-rendered from icon.svg by tools/generate-icons.bat and committed, so no
# rasterization happens here.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Windows matches the .exe release environment: default (wgpu/DX12) backend,
  # no extra system packages.
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

      # The test run above exercises the default (wgpu) backend. glow is the
      # Linux release backend; the compile check here (in addition to the Linux
      # job below) catches Windows-specific glow breakage cheaply.
      - name: Build glow backend
        run: cargo build -p FastTIFF --no-default-features --features renderer-glow

      # fast-tiff-lib without memmap or the C zstd codec — the shape the wasm
      # build uses. This runs the *same* suite as the default build: the
      # `open`-based integration tests used to be gated off here, which
      # silently cost this step every one of them (a test binary with zero
      # tests still prints `ok`); they now go through `tests/common::open_tiff`.
      - name: Test lib with no default features (wasm-shaped)
        run: cargo test -p fast-tiff-lib --no-default-features

      # And that it genuinely builds for the wasm target, not just with the
      # features off on a native host.
      - name: Check the wasm target
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p fast-tiff-lib --target wasm32-unknown-unknown --no-default-features
          cargo check -p fast-tiff-viewer --target wasm32-unknown-unknown --no-default-features --features backend-wgpu

      # The egui UI is shared between the desktop binary and the browser build,
      # so a desktop-only edit can break the wasm side. This is the check that
      # catches it — `FastTIFF-web` is its own workspace, hence the separate
      # invocation.
      - name: Check the shared UI builds for the web
        working-directory: FastTIFF-web
        run: cargo check --target wasm32-unknown-unknown

      # The single-threaded shape of fast-tiff-viewer — no read-ahead worker, no
      # background volume builder, no rayon — which is what a wasm frontend will
      # build. Nothing in the desktop app selects it, so without this step the
      # `#[cfg(not(feature = "threads"))]` fallbacks would rot unnoticed.
      - name: Check core without threads (wasm-shaped)
        run: cargo test -p fast-tiff-viewer --no-default-features --features backend-wgpu

      # And with no GPU backend at all: the CPU-side model must stand alone, so
      # headless tooling can use it without pulling in wgpu or glow.
      - name: Check core with no backend
        run: cargo check -p fast-tiff-viewer --no-default-features

  # macOS compiles the `#[cfg(target_os = "macos")]` code no other job sees —
  # the macos_open.rs "Open With" FFI — and runs its unit tests. arm64, matching
  # the primary .dmg release target.
  test-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  # Linux compiles the target-gated x11/wayland eframe features with the glow
  # backend — the exact configuration the .deb / Arch release jobs ship. Same
  # build-time system libs as the release deb job.
  test-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      - name: Run tests (glow backend)
        run: cargo test --workspace --no-default-features --features FastTIFF/renderer-glow

  # `fast-tiff-lib` parses completely untrusted files, so a malformed TIFF must
  # never panic, abort (an oversized allocation calls abort(), which no caller
  # can catch), or exhaust memory. `tests/malformed_robustness.rs` pins the
  # cases we already know about and runs everywhere; this job adds the part
  # that *explores*, which needs nightly + libFuzzer and so only runs here.
  #
  # A short, fixed budget per target: enough to catch a regression that makes
  # the seed corpus crash immediately, without turning CI into a fuzzing farm.
  # Real campaigns are run by hand (see fast-tiff-lib/fuzz/README.md).
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target\nfast-tiff-lib/fuzz -> fast-tiff-lib/fuzz/target"

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # The corpus directory goes first — libFuzzer writes discoveries into it
      # and treats later directories as read-only, which keeps the committed
      # seeds pristine. -rss_limit_mb turns runaway memory into a reported crash
      # rather than letting the runner OOM-kill the job with no artifact.
      - name: Fuzz the indexer
        working-directory: fast-tiff-lib
        run: |
          mkdir -p fuzz/corpus/tiff_open
          cargo fuzz run tiff_open fuzz/corpus/tiff_open fuzz/seeds -- -max_total_time=120 -rss_limit_mb=2048 -malloc_limit_mb=512

      - name: Fuzz the decoders
        working-directory: fast-tiff-lib
        run: |
          mkdir -p fuzz/corpus/tiff_decode
          cargo fuzz run tiff_decode fuzz/corpus/tiff_decode fuzz/seeds -- -max_total_time=180 -rss_limit_mb=2048 -malloc_limit_mb=512

      # A crashing input is the whole point — keep it when one is found.
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fast-tiff-lib/fuzz/artifacts/
          if-no-files-found: ignore