[package]
name = "fasttiff-builtin-plugins"
version = "0.28.1"
edition = "2021"
rust-version.workspace = true
description = "The plugins FastTIFF compiles in: filters, registration, deconvolution, and the PNG, OIR, NIfTI and DICOM importers, written against the FastTIFF plugin SDK alone."
# GPL-3.0, where the viewer core and the plugin SDK are MPL-2.0. Two of the
# plugins here link GPL-3.0-only crates: `stabilize` is a port of suite2p's
# registration (`suite2p-registration`), `turboreg` links
# `turboreg-registration`, and both link the `image-registration-support` they
# share. The copyleft travels with them into whatever links them, so every
# plugin is kept here, in one GPL crate, and the core they plug into links
# none of them. The applications that link this crate, `FastTIFF` and
# `FastTIFF-web`, are GPL-3.0 already.
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/konung-yaropolk/FastTIFF"
keywords = ["tiff", "microscopy", "plugin", "registration", "deconvolution"]
categories = ["multimedia::images", "science"]

include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[features]
default = ["threads", "mmap", "builtin-plugins"]

# ---------------------------------------------------------------------------
# Which plugins are compiled in.
#
# One feature per plugin directory under `src/`, and `builtin-plugins` is all
# of the ones that ship. This list is the whole switch: a plugin left out of it
# is absent from the binary, its menu entry is never drawn, and anything it
# alone depended on is not compiled or linked — which is the point, since
# `plugin-deconvolve` carries an FFT and `plugin-suite2p-stabilize` carries a
# whole registration crate.
#
# Removing one is a product decision rather than a build tweak, so two of them
# are worth calling out:
#
# * `plugin-suite2p-stabilize` and `plugin-turboreg-stabilize` are the two that
#   link GPL-3.0-only crates (see the licence note above). A build without both
#   links none of the registration crates, but this crate is GPL-3.0-only
#   itself, so whatever links it is GPL-3.0 whichever plugins are on. Leaving
#   them out makes a smaller build, not a differently licensed one.
# * `plugin-png` is the only importer *and* exporter a browser build has.
#   Without it the web build can open nothing but TIFF and save nothing but
#   TIFF, which is a smaller application than it looks.
#
# Nothing here is target-gated. Plugins that cannot work on a given target say
# so in their own `cfg` next to the reason — see the `builtins!` table in
# `src/lib.rs` — so that enabling one for a target it cannot serve is inert
# rather than broken.
builtin-plugins = [
    "plugin-zproject",
    "plugin-plot-axis",
    "plugin-image-tools",
    "plugin-animation-3d",
    "plugin-suite2p-stabilize",
    "plugin-turboreg-stabilize",
    "plugin-deconvolve",
    "plugin-png",
    "plugin-oir",
    "plugin-nifti",
    "plugin-dicom",
]

# Tools with no external dependencies.
plugin-image-tools = ["_shared-deliver", "_shared-store"]
plugin-zproject = []
plugin-plot-axis = []
# The 3D animation is poses and nothing else: the host plays them, so the
# plugin needs no renderer and no dependency of its own.
plugin-animation-3d = []

# And the ones that bring a dependency with them. Each names only what *it*
# needs, so the dependency arrives with the plugin and leaves with it.
# `suite2p-registration` is the registration algorithm; `rustfft` the
# deconvolution transforms and `fast-tiff-lib` the reader of the PSF file it
# opens for itself; `png` the PNG importer/exporter; `oir-reader` the OIR
# container reader.
plugin-suite2p-stabilize = [
    "dep:suite2p-registration",
    "dep:image-registration-support",
    "_shared-edges",
    "_shared-store",
]
# StackReg registration. A second registration crate rather than an option on
# the first: the two answer different questions (a shift by phase correlation
# versus a transformation by optimisation) and share no code. Also GPL-3, for
# its own reasons — see that crate's manifest.
plugin-turboreg-stabilize = [
    "dep:turboreg-registration",
    "dep:image-registration-support",
    "_shared-deliver",
    "_shared-store",
    "_shared-edges",
]
plugin-deconvolve = ["dep:rustfft", "dep:fast-tiff-lib", "_shared-deliver", "_shared-store"]
plugin-png = ["dep:png"]
plugin-oir = ["dep:oir-reader"]
# The two MRI readers. `plugin-dicom` brings nothing with it — the format is
# read from its own bytes — and `plugin-nifti` brings only gzip, which
# fast-tiff-lib's Deflate codec already puts in the tree, so neither adds a
# crate to the build.
plugin-nifti = ["dep:flate2"]
# `zune-jpeg` decodes the baseline (DCT) transfer syntax. The *lossless* one is
# hand-rolled in `dicom/lossless.rs` — no crate on crates.io decodes it, zune
# included, and it is the one medical archives actually use.
plugin-dicom = ["dep:zune-jpeg"]

# What `src/shared` is compiled for: the facilities several plugins share.
# Each plugin feature above names the ones it uses, so the code's conditions
# name a facility rather than a list of plugins that has to be kept in step by
# hand. Not for choosing directly.
_shared-deliver = []
_shared-store = []
_shared-edges = []

# ---------------------------------------------------------------------------
# The registration plugins' GPU paths (`stabilize` and `turboreg`), and with
# them `share_gpu_device`. Off by default: each is a compute pipeline of its
# own, not the renderer's, so it pulls wgpu into builds that would not
# otherwise have it — including the glow one. Turn it on where the machines
# running this have GPUs worth using; the plugins say plainly when the backend
# is not there rather than quietly using the processor.
# `?/`: each GPU path belongs to a plugin that may not be here. Without the weak
# form this would pull a registration crate back in on its own, which is the
# one thing `plugin-suite2p-stabilize = off` / `plugin-turboreg-stabilize = off` is for.
gpu-registration = [
    "suite2p-registration?/gpu",
    "turboreg-registration?/gpu",
    "image-registration-support?/gpu",
    "dep:wgpu",
]
# Deconvolution's transforms and arithmetic across threads (`deconvolve/par.rs`
# and `deconvolve/fft.rs`). On by default; a single-threaded host — notably
# `wasm32-unknown-unknown`, where `std::thread::spawn` is unavailable — turns
# it off and gets the sequential fallbacks beside each. The registration
# crates' threads are not this switch: see the native block below.
threads = ["dep:rayon"]
# Forwarded to the OIR importer's reader, where that is built, so `mmap` means
# "this build memory-maps the files it opens", as it does for `fast-tiff-viewer`.
# Without it the importer reads each part through a bounded buffer instead.
mmap = ["oir-reader?/mmap"]

[dependencies]
# What a third-party plugin depends on, and all a plugin here may use of the
# host: the traits it implements and the dialog, image and result types
# (`-api`), and the `Registrar` it is installed through (`fasttiff-plugin`,
# which carries the C ABI, `-abi`, with it). Not `fast-tiff-viewer`: that is
# the host, and a plugin that could reach into it would be a plugin the C
# boundary does not describe. The rule used to be a convention, written at
# the top of the directory these lived in; here it is the dependency list.
fasttiff-plugin-api = { path = "../fasttiff-plugin-api" }
fasttiff-plugin = { path = "../fasttiff-plugin" }
# For `share_gpu_device` to say when a registration had a device already.
log = { workspace = true }

# The registration algorithm behind the `stabilize` plugin. GPL-3, which is
# why this crate is; see the licence note at the top.
#
# `default-features = false` is what lets this be a shared dependency at all.
# Its default is `threads`, which is rayon. rayon does build for wasm — it falls
# back to running a `par_iter` on the calling thread — so this is about weight
# and honesty rather than about compiling: a thread pool that can never run is a
# large thing to send over the network, and `Backend::MultiThread` under that
# fallback is a single-threaded run that calls itself otherwise. The threaded
# build is restored for every target that has threads, in the native block
# below; a browser gets the same arithmetic on one thread and is told so.
suite2p-registration = { path = "../suite2p-registration", default-features = false, optional = true }
# The GPU device both registration plugins run on, handed the renderer's once
# (`share_gpu_device`).
image-registration-support = { path = "../image-registration-support", default-features = false, optional = true }
turboreg-registration = { path = "../turboreg-registration", default-features = false, optional = true }
# Only to hand the renderer's device to the two above (`share_gpu_device`):
# the same wgpu they and the renderer use, so it adds nothing to the build.
wgpu = { workspace = true, optional = true }

# Two plugins that the browser build also gets, so their dependencies are not
# desktop-only either: `png` for the PNG importer/exporter, `rustfft` for the
# deconvolution tools. Both build for wasm. Optional, and pulled in by the
# plugin that needs them — see the feature list above.
png = { version = "0.18", optional = true }
# Convolving a 512-cubed volume with a PSF directly is 10^14 multiplies; through
# a pair of FFTs it is seconds, so an FFT is no more optional here than it is
# for registration. Same crate and same major version `suite2p-registration`
# already pulls in, so the workspace builds one copy of it.
rustfft = { workspace = true, optional = true }
# The PSF file deconvolution opens for itself: a plugin may read a file of its
# own, and a PSF is a TIFF. The same reader the host uses, so it is in the
# build already and adds nothing; without its default features, so that this
# crate decides nothing about memory maps or the C zstd codec — the
# application does.
fast-tiff-lib = { path = "../fast-tiff-lib", default-features = false, optional = true }
# Deconvolution across threads, behind `threads`: rayon needs real threads to
# build, let alone run.
rayon = { workspace = true, optional = true }

# Desktop-only, target-gated rather than put behind a feature, for the reasons
# each gives.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Threads for the registration crates, on every target that has them. Target-
# gated rather than tied to this crate's own `threads` feature, and that is
# deliberate: `threads` can be switched off on a native host, where rayon builds
# perfectly well and the registration should still use it. What rayon cannot do
# is build for wasm, and `cfg(not(target_arch = "wasm32"))` is the condition
# that says exactly that and cannot be forgotten.
suite2p-registration = { path = "../suite2p-registration", default-features = false, features = ["threads"], optional = true }
turboreg-registration = { path = "../turboreg-registration", default-features = false, features = ["threads"], optional = true }
# The OIR container reader behind the importer. A crate of its own, which
# builds for wasm, but native-only here for the reason `flate2` is below: the
# importer that uses it is handed a path, and a browser has none. Without its
# default features, so that this crate's `mmap` decides whether parts are
# mapped. Its quick-xml and memmap2 are the versions fast-tiff-lib already
# brings, so it adds no crate to the build but itself.
oir-reader = { path = "../oir-reader", default-features = false, optional = true }
# `.nii.gz`, which is how NIfTI volumes are almost always distributed — the
# plain `.nii` is the exception. Whole-file gzip and nothing more exotic, so
# this is `flate2`'s simplest use. Already in the tree twice over (fast-tiff-lib
# decodes Deflate-compressed TIFFs with it, and `png` pulls it in), at the same
# version, so the NIfTI reader compiles no new crate.
#
# Here rather than in the shared table because the importer lane is native-only
# — see `src/nifti/mod.rs` for why — and a dependency for a module that cannot
# be reached on a target has no business being compiled for it.
flate2 = { workspace = true, optional = true }
# Baseline JPEG, for the DICOM transfer syntax that uses it. Pure Rust, and
# already in this workspace's tree via `image` (which `FastTIFF` uses to decode
# its own icon), so the same version is built once.
#
# It decodes baseline and progressive and says plainly that it cannot do
# lossless Huffman, which is why `dicom/lossless.rs` exists beside it rather
# than this being the whole JPEG story.
zune-jpeg = { version = "0.5", optional = true }

[dev-dependencies]
# The host, for the tests: they run each plugin against a real document
# through `StackHost`, and through the registry's C boundary, which is what an
# application does with them. A dev-dependency only, so the plugins themselves
# cannot reach it. Without its default features, so that a test run of this
# crate with `--no-default-features` is not handed a threaded viewer through
# here: what a test build of the two together runs with is what the command
# asked for.
fast-tiff-viewer = { path = "../fast-tiff-viewer", default-features = false }
# Writing the TIFFs the tests open, and the PSF files deconvolution reads.
fast-tiff-lib = { path = "../fast-tiff-lib", default-features = false }
