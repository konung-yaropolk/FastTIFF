# A Rust port of the registration (motion-correction) algorithm from suite2p.
#
# GPL-3.0, because suite2p is: this is a derivative work of
# https://github.com/MouseLand/suite2p (Copyright © 2023 Howard Hughes Medical
# Institute, authored by Carsen Stringer and Marius Pachitariu), and the licence
# travels with the algorithm whoever retypes it.
[package]
name = "suite2p-registration"
version = "0.27.0"
edition = "2021"
rust-version.workspace = true
description = """
Motion correction for two-photon timelapses: rigid and non-rigid registration \
by phase correlation, and bidirectional-phase (resonant scanner) correction. \
A Rust port of suite2p's registration, parameter for parameter.\
"""
license = "GPL-3.0-only"
repository = "https://github.com/konung-yaropolk/FastTIFF"
homepage = "https://github.com/konung-yaropolk/FastTIFF"
readme = "README.md"
keywords = ["microscopy", "registration", "suite2p", "neuroscience", "imaging"]
categories = ["science", "algorithms", "multimedia::images"]
# The GPU backend is behind a feature, so docs.rs is told to build it — a module
# that is not in the documentation may as well not exist.
[package.metadata.docs.rs]
features = ["gpu", "capi"]

[dependencies]
# The C interface's scaffolding (last-error slot, panic guard), shared with this
# repository's other C APIs; only with `capi`. With a version as well as the
# path, as a published crate's dependency must be.
c-api-support = { path = "../c-api-support", version = "0.1.0", optional = true }
# Phase correlation is FFT-based, so an FFT is not optional. `rustfft` is
# MIT OR Apache-2.0, which combines into a GPL-3 work without friction, and it
# handles non-power-of-two sizes (Bluestein) — which matters, because a
# 1024x768 frame is not a power of two in either axis.
rustfft = { workspace = true }
# Multi-threaded CPU registration: frames are independent, so a batch of them is
# an embarrassingly parallel map. It goes through the `par` of
# `image-registration-support` (re-exported as this crate's), which is rayon
# behind `threads` and sequential stand-ins without it: rayon builds for wasm
# but only runs a `par_iter` on the calling thread there, and
# `Backend::MultiThread` would then be a single-threaded run calling itself
# otherwise. The algorithm needs no thread.
#
# A version as well as the path: this crate is published, and a published
# crate's dependencies must be on crates.io too.
image-registration-support = { path = "../image-registration-support", version = "0.1.0", default-features = false }

# The GPU backend, behind a feature so the algorithm crate does not drag a
# graphics stack into anything that only wants the CPU path. Same wgpu the
# renderer already uses, so it is a feature flag rather than a new dependency
# for the project.
wgpu = { workspace = true, optional = true }
bytemuck = { workspace = true, features = ["derive"], optional = true }
pollster = { workspace = true, optional = true }

[features]
default = ["threads"]
# Parallel CPU registration. On by default: every native build wants it, and a
# crate that had to be asked for its usual behaviour would be a trap. Turning it
# off leaves the arithmetic untouched and `Backend::MultiThread` unavailable —
# `src/par.rs` says what that costs and why it costs nothing else.
threads = ["image-registration-support/threads"]
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster", "image-registration-support/gpu"]

# A C interface — `src/capi.rs`, declared in `include/suite2p_registration.h` — for linking
# into C and C++ programs as a shared or static library. Adds one small
# dependency of this repository's own, `c-api-support`, which has none.
# The crate type is chosen when building (`cargo rustc --crate-type`; see the
# README's "From C and C++") rather than listed under `[lib]`, because a
# `cdylib` listed there is built by every crate that depends on this one.
capi = ["dep:c-api-support"]
