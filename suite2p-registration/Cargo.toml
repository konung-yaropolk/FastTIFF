# A Rust port of the registration (motion-correction) algorithm from suite2p.
#
# GPL-3.0, because suite2p is: this is a derivative work of
# https://github.com/MouseLand/suite2p (Copyright © 2023 Howard Hughes Medical
# Institute, authored by Carsen Stringer and Marius Pachitariu), and the licence
# travels with the algorithm whoever retypes it.
[package]
name = "suite2p-registration"
version = "0.19.5"
edition = "2021"
# `Option::is_none_or`, in the GPU backend's context cache.
rust-version = "1.82"
description = """
Motion correction for two-photon timelapses: rigid and non-rigid registration \
by phase correlation, and bidirectional-phase (resonant scanner) correction. \
A Rust port of suite2p's registration, parameter for parameter.\
"""
license = "GPL-3.0-only"
repository = "https://github.com/konung-yaropolk/FastTIFF"
homepage = "https://github.com/konung-yaropolk/FastTIFF"
readme = "README.md"
keywords = ["microscopy", "registration", "suite2p", "neuroscience", "imaging"]
categories = ["science", "algorithms", "multimedia::images"]
# The GPU backend is behind a feature, so docs.rs is told to build it — a module
# that is not in the documentation may as well not exist.
[package.metadata.docs.rs]
features = ["gpu"]

[dependencies]
# Phase correlation is FFT-based, so an FFT is not optional. `rustfft` is
# MIT OR Apache-2.0, which combines into a GPL-3 work without friction, and it
# handles non-power-of-two sizes (Bluestein) — which matters, because a
# 1024x768 frame is not a power of two in either axis.
rustfft = "6"
# Multi-threaded CPU registration: frames are independent, so a batch of them is
# an embarrassingly parallel map. Already in this workspace (fast-tiff-lib uses
# it for strip decompression), so it is not a new dependency for the project.
rayon = "1.10"

# The GPU backend, behind a feature so the algorithm crate does not drag a
# graphics stack into anything that only wants the CPU path. Same wgpu the
# renderer already uses, so it is a feature flag rather than a new dependency
# for the project.
wgpu = { version = "29", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "1.0", optional = true }

[features]
default = []
gpu = ["dep:wgpu", "dep:bytemuck", "dep:pollster"]
