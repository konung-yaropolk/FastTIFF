[package]
name = "fast-tiff-lib"
version = "0.26.4"
edition = "2021"
description = "Lazy, memory-mapped reader/writer for TIFF files: IFD indexing, ImageJ + OME-TIFF metadata parsing, and per-frame strip decoding."
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/konung-yaropolk/FastTIFF"
keywords = ["tiff", "imagej", "science", "microscopy", "astronomy"]
categories = ["visualization", "multimedia::images", "parser-implementations", "science"]

include = [
    "src/**/*.rs",
    "include/**/*.h",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

# The C interface is behind a feature, so docs.rs is told to build it — a module
# that is not in the documentation may as well not exist.
[package.metadata.docs.rs]
features = ["capi"]

[features]
default = ["mmap", "codec-zstd"]
# Memory-mapped file access, and with it `TiffStack::open`. Off on targets with
# no filesystem (wasm), where `TiffStack::from_bytes` is the way in instead.
mmap = ["dep:memmap2"]
# ZSTD codec (compression = 50000). A C dependency via zstd-sys, so it cannot
# build for wasm32-unknown-unknown; a stack using ZSTD strips then reports an
# unsupported-compression error instead of decoding.
codec-zstd = ["dep:zstd"]
# A C interface — `src/capi.rs`, declared in `include/fast_tiff_lib.h` — for linking
# into C and C++ programs as a shared or static library. Adds no dependency.
# The crate type is chosen when building (`cargo rustc --crate-type`; see the
# README's "From C and C++") rather than listed under `[lib]`, because a
# `cdylib` listed there is built by every crate that depends on this one.
capi = []

[dependencies]
memmap2 = { version = "0.9", optional = true }
weezl = "0.2"      # LZW codec (compression = 5)
flate2 = "1.1"     # Deflate/Zip codec (compression = 8 / 32946)
zstd = { version = "0.14", optional = true } # ZSTD codec (50000, libtiff/GDAL ext)
anyhow = "1.0"
bytemuck = { version = "1.25", features = ["extern_crate_alloc"] }
rayon = "1.10"     # data-parallel strip decompression + 32-bit conversion
quick-xml = "0.37" # OME-TIFF metadata (OME-XML in ImageDescription)

[dev-dependencies]
