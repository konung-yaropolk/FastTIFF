# A reader/writer speed benchmark comparing, on identical multi-frame TIFF
# stacks (written by fast-tiff-lib's own writer, cross-validated against
# libtiff/tifffile in the crate's test suite):
#   * fast-tiff-lib   (Rust, this repo, memory-mapped)  -- per-frame + preload
#   * tiff            (Rust, crates.io, pure Rust)      -- reference decoder
#   * TinyTIFF        (C, vendored, via FFI)            -- uncompressed only
#   * libtiff         (C, system library, via FFI)      -- used when present
#   * RAW fread       (lower-bound baseline)
#
# Methodology follows jkriege2/TinyTIFF's speedtest: per-frame timing, the
# slowest REMOVE_SLOWEST_PERCENT trimmed before averaging, warm page cache.
#
# libtiff is found and linked automatically wherever the machine has one
# (build.rs searches LIBTIFF_DIR, pkg-config, vcpkg, and the MSYS2/Homebrew/
# MacPorts/conda prefixes); the run header says whether it was. It is NOT
# vendored like TinyTIFF: stripped of zlib and libzstd it cannot read Deflate
# or Zstd, which is a third of this matrix, so a vendored copy would measure a
# libtiff nobody runs. `--features libtiff` only turns "not found" into a hard
# error, for CI that requires the comparison to be complete.
#
# Everything else builds anywhere a C compiler exists (for the vendored TinyTIFF).

[package]
name = "tiff_read_bench"
version = "0.2.0"
edition = "2021"
build = "build.rs"

# Standalone: not a member of the repo's workspace.
[workspace]

[features]
default = []
# Not "enable libtiff" — it is enabled by discovery. This makes its *absence*
# fail the build instead of quietly producing a run without it.
libtiff = []

[dependencies]
fast-tiff-lib = { path = ".." }
tiff = "0.11"
anyhow = "1"
sysinfo = "0.30"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
