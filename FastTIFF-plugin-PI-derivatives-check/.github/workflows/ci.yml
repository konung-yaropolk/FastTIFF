name: CI

# One job per OS. A plugin is a shared library the host opens with the
# platform's own loader — LoadLibrary, dlopen, dyld — and `tests/overlay.rs`
# drives that loader for real, so "it built" is not the same as "it loads".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # The GUI crate this tests against links GTK3, OpenGL and the X11 /
      # Wayland stack. Only Linux needs them spelled out.
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxkbcommon-dev libwayland-dev

      # `cargo test` does not build a `cdylib`, so without this the loader has
      # nothing current to open.
      - name: Build the plugin library
        run: cargo build

      - name: Test
        run: cargo test

      - name: Lint
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
