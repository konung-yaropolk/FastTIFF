[workspace]
resolver = "2"
# Layered bottom-up, each crate GUI-agnostic until the last:
#   fast-tiff-lib     file I/O, IFD index, decode, metadata
#   scivis-render     GPU pipelines, textures, ray-marching
#   fast-tiff-viewer  stack model, channel settings, decode -> GPU sync
#   FastTIFF          the eframe desktop frontend
# A future wasm frontend becomes a fifth member alongside `FastTIFF`, reusing
# the lower three unchanged.
members = ["fast-tiff-lib", "scivis-render", "fast-tiff-viewer", "fasttiff-plugin-api", "fasttiff-plugin-abi", "fasttiff-plugin", "FastTIFF"]
# The fuzz harness is its own crate: it needs nightly + libFuzzer, so keeping it
# out of the workspace means `cargo build/test --workspace` stays stable-only.
# Run it with `cargo +nightly fuzz run <target>` from `fast-tiff-lib/`.
# `plugins/example` is kept as a worked example for plugin authors rather than
# as part of the product, so it is excluded rather than a member: excluded (not
# merely unlisted) is what lets it still be built and tested on its own.
#
#     cargo test --manifest-path plugins/example/Cargo.toml
#
# Worth knowing what that costs. Its `tests/boundary.rs` is the only thing that
# drives the real shared-library loader against a real `.dll` and checks the
# result against the built-in filter it was copied from — the one test that
# crosses the plugin boundary for real. Out of `--workspace`, it no longer runs
# in CI, so run the line above after changing anything in the plugin ABI.
# `FastTIFF-plugin-PI-derivatives-check` is on its way out of this repository
# entirely: a stimulus-derivative analysis for one lab's two-photon protocol,
# which is too specific to ship with a TIFF viewer. It is excluded rather than
# deleted so that it keeps building where it stands until it is moved, and its
# directory is already laid out as the repository it is about to become.
#
#     cargo test --manifest-path FastTIFF-plugin-PI-derivatives-check/Cargo.toml
exclude = [
    "fast-tiff-lib/fuzz",
    "plugins/example",
    "FastTIFF-plugin-PI-derivatives-check",
]

[profile.release]
opt-level = 3
lto = "fat"        # Enable Link-Time Optimization
codegen-units = 1  # Helps LTO optimize more effectively
strip = true       # Automatically strip symbols from the binary.
panic = 'unwind'   # 'abort' to kill process or 'unwind' for safe memory cleanup

[profile.dev]
# Keep IFD-walking / decode fast even in debug builds — these are the
# hot paths during scrubbing and an unoptimized debug build is painfully
# slow when stepping through a multi-GB stack frame by frame.
# opt-level = 2
