[workspace]
resolver = "2"
# Layered bottom-up, each crate GUI-agnostic until the last:
#   fast-tiff-lib     file I/O, IFD index, decode, metadata
#   oir-reader        the Olympus OIR container reader, standalone beside it
#   scivis-render     GPU pipelines, textures, ray-marching
#   fast-tiff-viewer  stack model, channel settings, decode -> GPU sync
#   FastTIFF          the egui UI (its library) and the desktop host (its binary)
#   FastTIFF-web      the browser host around that same library
#
# The browser host is a member like the others, so the bundle the site serves
# is built from the lock `cargo test --workspace` runs against. Being a member
# costs the desktop build nothing: everything that crate depends on is behind
# `cfg(target_arch = "wasm32")`, and under resolver 2 a dependency for a target
# that is not being built adds no features to the ones that are.
members = ["fast-tiff-lib", "oir-reader", "scivis-render", "fast-tiff-viewer", "fasttiff-plugin-api", "fasttiff-plugin-abi", "fasttiff-plugin", "FastTIFF", "FastTIFF-web", "plugins/PI-derivatives-check", "suite2p-registration", "turboreg-registration"]
# The fuzz harness is its own crate: it needs nightly + libFuzzer, so keeping it
# out of the workspace means `cargo build/test --workspace` stays stable-only.
# Run it with `cargo +nightly fuzz run <target>` from `fast-tiff-lib/`.
# `plugins/example` is kept as a worked example for plugin authors rather than
# as part of the product, so it is excluded rather than a member: excluded (not
# merely unlisted) is what lets it still be built and tested on its own.
#
#     cargo test --manifest-path plugins/example/Cargo.toml
#
# Worth knowing what that costs. Its `tests/boundary.rs` is the only thing that
# drives the real shared-library loader against a real `.dll` and checks the
# result against the built-in filter it was copied from — the one test that
# crosses the plugin boundary for real. Out of `--workspace`, it no longer runs
# in CI, so run the line above after changing anything in the plugin ABI.
# `plugins/PI-derivatives-check` is a *member*, unlike `plugins/example`. It
# reproduces one lab's two-photon stimulation analysis, which is too specific to
# ship with a TIFF viewer, and it did live outside this repository for a while
# — but a plugin built from its own checkout could not be made to run on the
# Windows 7 target, which this workspace's release build supports. Building it
# here, against the same toolchain and the same pinned dependency graph as the
# host it loads into, is what fixes that. Being a member also means
# `cargo test --workspace` runs its boundary tests, which is where they belong:
# they drive the host's real plugin loader against this plugin.
exclude = [
    "fast-tiff-lib/fuzz",
    "plugins/example",
]

# The oldest Rust every library crate builds with, all features on; the CI
# `msrv` step builds them with exactly this toolchain, reading the number from
# here. The floor is real twice over: fast-tiff-lib's LZW decoder (weezl 0.2)
# needs 1.88, and so does `as_chunks`, which the decoders use.
#
# The applications (FastTIFF, FastTIFF-web, the PI plugin) declare none: they
# are built with the toolchain `rust-toolchain.toml` pins, and eframe alone
# needs 1.92, so a number here would be one nothing checks.
[workspace.package]
rust-version = "1.88"

# Versions more than one member depends on, named once.
#
# wgpu above all. The registration crates are handed the renderer's own device
# (`use_device` takes a `wgpu::Device`), which only type-checks while every
# member names the same wgpu — and that has to be the one eframe's `egui-wgpu`
# is built on. A bump here moves them together; a bump made in one member's
# manifest, as a dependency bot does, would split the build in two.
#
# naga is the shader compiler that wgpu carries. The shader test
# (`scivis-render/tests/wgsl.rs`) validates the WGSL with the same one, so a
# shader it passes is a shader the shipped wgpu accepts.
#
# eframe, egui and egui_extras are one release train, and eframe's renderer is
# the reason wgpu is pinned above: bump the four together. Default features off
# for eframe and egui_extras everywhere, so a member names exactly the ones it
# wants (each has a note on why).
[workspace.dependencies]
wgpu = "29"
naga = { version = "29", features = ["wgsl-in"] }
eframe = { version = "0.34", default-features = false }
egui = "0.34"
egui_extras = { version = "0.34", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"
rayon = "1.10"
bytemuck = "1.25"
# 0.4, the one eframe and rfd use, so the app carries one pollster, not two.
pollster = "0.4"
quick-xml = "0.37"
memmap2 = "0.9"
flate2 = "1.1"
rustfft = "6"
log = "0.4"
anyhow = "1.0"

[profile.release]
opt-level = 3
lto = "fat"        # Enable Link-Time Optimization
codegen-units = 1  # Helps LTO optimize more effectively
strip = true       # Automatically strip symbols from the binary.
panic = 'unwind'   # 'abort' to kill process or 'unwind' for safe memory cleanup

# Except the web bundle, which must keep its `target_features` section.
# `strip = true` makes wasm-ld drop every custom section, that one included, and
# wasm-opt reads it to learn which features the module uses. Without it,
# wasm-opt validates the module as MVP wasm and rejects the bulk-memory
# instructions rustc has emitted by default for wasm32 since 1.87 ("Bulk memory
# operations require bulk memory"). Stripping debug info only, which is the
# release default, leaves the section alone.
[profile.release.package.fasttiff-web-egui]
strip = "debuginfo"

[profile.dev]
# Keep IFD-walking / decode fast even in debug builds — these are the
# hot paths during scrubbing and an unoptimized debug build is painfully
# slow when stepping through a multi-GB stack frame by frame.
# opt-level = 2
