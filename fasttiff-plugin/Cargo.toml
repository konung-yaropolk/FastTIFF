# What a plugin author actually writes against.
#
# Unlike `fasttiff-plugin-abi`, this crate is NOT frozen: it compiles into the
# plugin, so it can change freely between versions. The frozen thing is the
# binary interface it generates, not the convenience API that generates it.
[package]
name = "fasttiff-plugin"
version = "0.18.0"
edition = "2021"
description = "Write a FastTIFF plugin as an ordinary Rust type; this generates the extern \"C\" boundary."
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/konung-yaropolk/FastTIFF"
keywords = ["tiff", "plugin", "imaging", "microscopy"]
categories = ["multimedia::images", "api-bindings"]

[dependencies]
fasttiff-plugin-api = { path = "../fasttiff-plugin-api", version = "0.18.0" }
fasttiff-plugin-abi = { path = "../fasttiff-plugin-abi", version = "0.18.0" }
