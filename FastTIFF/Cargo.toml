[package]
name = "FastTIFF"
version = "1.16.6"
edition = "2021"
description = "A lightning-fast multi-frame TIFF viewer with ImageJ-compatible rendering."
license = "GPL-3.0-only"

# Exactly one GPU renderer is compiled in, chosen by these features. wgpu
# (DX12/Vulkan/Metal) is the default — preferred on macOS (where OpenGL is
# deprecated) and the more actively developed backend. Build the glow (OpenGL)
# variant with:
#     cargo build --no-default-features --features renderer-glow
# glow is the portable fallback: it links only OpenGL (near-universal on
# Linux), and avoids a Windows 10 idle-CPU spin that wgpu triggers on some
# machines. Each feature turns on the matching eframe backend, so the *unused*
# renderer's entire dependency subtree is excluded from the build (`cargo tree`).
[features]
default = ["renderer-wgpu"]
# Each feature turns on the matching eframe backend AND the matching backend in
# `scivis-render`, so the *unused* renderer's entire dependency subtree is
# excluded from the build (`cargo tree`).
renderer-wgpu = ["eframe/wgpu", "scivis-render/backend-wgpu", "fast-tiff-viewer/backend-wgpu"]
renderer-glow = ["eframe/glow", "scivis-render/backend-glow", "fast-tiff-viewer/backend-glow"]

# lib + bin: the library half holds the egui UI so `FastTIFF-web` can compile
# the same interface to wasm; the binary is just the native host around it.
[lib]
name = "fasttiff"
path = "src/lib.rs"

[[bin]]
name = "FastTIFF"
path = "src/main.rs"

[dependencies]
# The stack model, channel/contrast settings, camera, and the decode->GPU sync
# — everything this app does that isn't a window or a widget.
fast-tiff-viewer = { path = "../fast-tiff-viewer", default-features = false }
fast-tiff-lib = { path = "../fast-tiff-lib", default-features = false }
# All GPU work lives here, free of any GUI toolkit. `src/render.rs` is the only
# file that bridges it to eframe; see that module's docs.
scivis-render = { path = "../scivis-render" }
# eframe with default features off: drops the active accesskit integration
# (`accesskit_winit`/`_windows`/`_consumer` — Windows UI Automation pumped from
# the event loop, unused here) and leaves the GPU backend unset so the
# `renderer-*` features above pick exactly one. `default_fonts` keeps the
# bundled text fonts. (egui still pulls the passive `accesskit` data-types crate
# as an unavoidable core dependency.)
eframe = { version = "0.34", default-features = false, features = ["default_fonts"] }
egui = "0.34"
egui_extras = "0.34"
anyhow = "1.0"
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
# Decodes the bundled PNG into RGBA for the application icon (see `window_icon`
# in main.rs). Needed on every native platform including macOS: eframe installs
# the icon there at runtime with `setApplicationIconImage:`, and substitutes its
# own default when none is given — which is how the egui logo ended up in the
# Dock. The png codec is already in the tree via eframe/arboard, so this
# compiles no new crates.
image = { version = "0.25", default-features = false, features = ["png"] }

# Threads, memory-mapped files and the C zstd codec all exist natively and none
# of them do on wasm, so the core is pulled in bare above and topped up here.
# `rfd`'s blocking dialog and the process fan-out are likewise native-only.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
fast-tiff-viewer = { path = "../fast-tiff-viewer", features = ["threads", "mmap", "codec-zstd"] }
# Also depended on directly (the UI names `Compression`, `SampleFormat`, …),
# so its host-dependent features need topping up here too — otherwise the
# C zstd codec follows the direct edge into the wasm build.
fast-tiff-lib = { path = "../fast-tiff-lib", features = ["mmap", "codec-zstd"] }

# The browser build needs the async picker and a task spawner instead.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

# Only needed on Windows, where build.rs embeds the icon + version metadata
# as a Win32 resource. Gated so non-Windows builds don't pull winres in.
[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

# Only needed on Linux. Linux windowing backends for winit. Cargo unions these with the eframe
# features above; target-gating keeps X11/Wayland out of Windows/macOS builds.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["x11", "wayland"] }


[package.metadata.winres]
OriginalFilename = "FastTIFF"
LegalCopyright = "konung_yaropolk © 2026"
FileDescription = "Fast TIFF Viewer"
ProductName = "Fast TIFF Viewer"

# `cargo deb` packaging, used by the Linux .deb job in
# .github/workflows/release.yml. `depends = "$auto"` lets cargo-deb compute the
# shared-library runtime deps straight from the built binary (dpkg-shlibdeps),
# so the GTK/OpenGL/X11/Wayland libs the glow GUI links are filled in for us.
# Add an email to `maintainer` (e.g. "konung_yaropolk <you@example.com>") for a
# lintian-clean package; a bare name builds fine but is warned about.
[package.metadata.deb]
maintainer = "konung_yaropolk"
section = "graphics"
priority = "optional"
depends = "$auto"
# postinst/postrm add and remove the lowercase `fasttiff` -> `FastTIFF` symlink
# in /usr/bin (a symlink we create there isn't a tracked package file).
maintainer-scripts = "packaging/deb"
# Listing assets disables cargo-deb's automatic binary inclusion, so the binary
# is listed here too. Paths are relative to this manifest dir; the workspace
# `target/` is resolved automatically. The .desktop entry + hicolor icons give
# the app a menu launcher (dpkg refreshes the icon/desktop caches on install).
assets = [
    ["target/release/FastTIFF", "usr/bin/FastTIFF", "755"],
    ["packaging/fasttiff.desktop", "usr/share/applications/fasttiff.desktop", "644"],
    ["icon/icon16.png", "usr/share/icons/hicolor/16x16/apps/fasttiff.png", "644"],
    ["icon/icon32.png", "usr/share/icons/hicolor/32x32/apps/fasttiff.png", "644"],
    ["icon/icon48.png", "usr/share/icons/hicolor/48x48/apps/fasttiff.png", "644"],
    ["icon/icon64.png", "usr/share/icons/hicolor/64x64/apps/fasttiff.png", "644"],
    ["icon/icon128.png", "usr/share/icons/hicolor/128x128/apps/fasttiff.png", "644"],
    ["icon/icon256.png", "usr/share/icons/hicolor/256x256/apps/fasttiff.png", "644"],
    # The TIFF *document* icon, under `mimetypes/` rather than `apps/`. Unlike
    # Windows and macOS, XDG has no notion of "the icon this application's
    # documents get" — a file manager looks up one icon per MIME type, shared by
    # every handler. So this is `image-tiff`, the standard name for image/tiff.
    #
    # Installed into **hicolor**, which is the fallback theme of last resort:
    # any real desktop theme (Adwaita, Papirus, Breeze) already defines
    # image-tiff and keeps winning. The effect is therefore to give TIFFs a
    # sensible icon on a system that had none, not to repaint them on a system
    # that did.
    ["icon/icon-image-tiff16.png", "usr/share/icons/hicolor/16x16/mimetypes/image-tiff.png", "644"],
    ["icon/icon-image-tiff32.png", "usr/share/icons/hicolor/32x32/mimetypes/image-tiff.png", "644"],
    ["icon/icon-image-tiff48.png", "usr/share/icons/hicolor/48x48/mimetypes/image-tiff.png", "644"],
    ["icon/icon-image-tiff64.png", "usr/share/icons/hicolor/64x64/mimetypes/image-tiff.png", "644"],
    ["icon/icon-image-tiff128.png", "usr/share/icons/hicolor/128x128/mimetypes/image-tiff.png", "644"],
    ["icon/icon-image-tiff256.png", "usr/share/icons/hicolor/256x256/mimetypes/image-tiff.png", "644"],
]

# `cargo generate-rpm` packaging (Fedora/RHEL/openSUSE) — the RPM counterpart to
# [package.metadata.deb], used by the build-linux-rpm job in
# .github/workflows/release.yml. cargo-generate-rpm is pure Rust (no rpmbuild
# needed), so the RPM is built on the same Ubuntu runner as the .deb. That means
# it links the runner's glibc, so it targets *recent* RPM distros (glibc ≥ the
# build image's) — the same portability envelope as the .deb.
#
# `cargo generate-rpm -p FastTIFF` runs from the WORKSPACE ROOT, so these asset
# `source` paths are workspace-root-relative (unlike the deb assets above, which
# cargo-deb resolves against this manifest's dir). Output lands in
# target/generate-rpm/fasttiff-<version>-1.<arch>.rpm (arch auto-detected).
[package.metadata.generate-rpm]
name = "fasttiff"
# `builtin`: scan the ELF's NEEDED sonames and emit `libfoo.so.N()(64bit)`
# Requires, which every RPM distro resolves through its own package Provides —
# more portable than hard-coding Fedora vs openSUSE package names, and it works
# when building on a non-RPM host (Ubuntu) where the usual find-requires helper
# isn't present.
auto-req = "builtin"
# Mirror the .deb/PKGBUILD lowercase `fasttiff` -> `FastTIFF` convenience symlink.
# Guard the %postun so it only fires on real removal ($1 == 0), not on an upgrade
# (where the new %post has already recreated the link).
post_install_script = "ln -sf FastTIFF /usr/bin/fasttiff"
post_uninstall_script = "if [ \"$1\" = 0 ]; then rm -f /usr/bin/fasttiff; fi"
assets = [
    { source = "target/release/FastTIFF", dest = "/usr/bin/FastTIFF", mode = "755" },
    { source = "FastTIFF/packaging/fasttiff.desktop", dest = "/usr/share/applications/fasttiff.desktop", mode = "644" },
    { source = "FastTIFF/icon/icon16.png", dest = "/usr/share/icons/hicolor/16x16/apps/fasttiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon32.png", dest = "/usr/share/icons/hicolor/32x32/apps/fasttiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon48.png", dest = "/usr/share/icons/hicolor/48x48/apps/fasttiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon64.png", dest = "/usr/share/icons/hicolor/64x64/apps/fasttiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon128.png", dest = "/usr/share/icons/hicolor/128x128/apps/fasttiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon256.png", dest = "/usr/share/icons/hicolor/256x256/apps/fasttiff.png", mode = "644" },
    # The TIFF document icon — see the note on the .deb assets above.
    { source = "FastTIFF/icon/icon-image-tiff16.png", dest = "/usr/share/icons/hicolor/16x16/mimetypes/image-tiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon-image-tiff32.png", dest = "/usr/share/icons/hicolor/32x32/mimetypes/image-tiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon-image-tiff48.png", dest = "/usr/share/icons/hicolor/48x48/mimetypes/image-tiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon-image-tiff64.png", dest = "/usr/share/icons/hicolor/64x64/mimetypes/image-tiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon-image-tiff128.png", dest = "/usr/share/icons/hicolor/128x128/mimetypes/image-tiff.png", mode = "644" },
    { source = "FastTIFF/icon/icon-image-tiff256.png", dest = "/usr/share/icons/hicolor/256x256/mimetypes/image-tiff.png", mode = "644" },
]
