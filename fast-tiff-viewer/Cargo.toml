[package]
name = "fast-tiff-viewer"
version = "0.28.1"
edition = "2021"
rust-version.workspace = true
description = "GUI-agnostic viewer core for multi-frame TIFF stacks: stack state, channel/contrast/LUT settings, c/z/t interpretation, 3D camera math, and the per-frame decode-to-GPU pipeline."
# MPL-2.0, as fast-tiff-lib, scivis-render and the plugin SDK are. It was
# GPL-3.0 while the built-in plugins were compiled into it, two of which link
# GPL-3.0-only registration crates; they are the `fasttiff-builtin-plugins`
# crate now, which the applications hand to the registry here
# (`plugins::Registry::new`), and this crate links nothing copyleft.
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/konung-yaropolk/FastTIFF"
keywords = ["tiff", "imagej", "microscopy", "viewer", "visualization"]
categories = ["visualization", "multimedia::images", "science"]

include = [
    "src/**/*.rs",
    # Ship the tests: they skip gracefully when the shared fixtures (which live
    # in fast-tiff-lib and are not published) aren't present.
    "tests/**/*.rs",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[features]
default = ["threads", "mmap", "codec-zstd"]

# No feature picks a plugin. The built-in plugins are the
# `fasttiff-builtin-plugins` crate, with their features and their dependencies;
# a frontend hands them to the registry at start-up (`plugins::Registry::new`),
# so this crate compiles the same whichever of them the application carries.
#
# No feature picks a GPU backend either. `Viewer::sync` is generic over the
# renderer traits of `scivis-render` and is compiled for whichever backend the
# frontend hands it, so this crate builds no backend of its own, and every
# build of it has the sync and its tests. There were `backend-wgpu` /
# `backend-glow` features here once, which the app had to keep matched with its
# own.
#
# Background worker threads (read-ahead decode + 3D volume assembly). On by
# default; a single-threaded host — notably `wasm32-unknown-unknown`, where
# `std::thread::spawn` is unavailable — turns this off and gets the synchronous
# fallback paths, which are already the code path taken whenever a worker fails
# to spawn. It also builds a packed volume's mip chain and brick maxima across
# threads (`scivis-render/rayon`).
threads = ["dep:rayon", "scivis-render/rayon"]
# Forwarded to fast-tiff-lib, so `mmap` means "this build memory-maps the files
# it opens". It brings `Viewer::open` (a path); without it only
# `Viewer::load_bytes` exists, which is all a browser can use anyway.
# `codec-zstd` is a C dependency and cannot build for wasm.
mmap = ["fast-tiff-lib/mmap"]
codec-zstd = ["fast-tiff-lib/codec-zstd"]

[dependencies]
fast-tiff-lib = { path = "../fast-tiff-lib", default-features = false }

scivis-render = { path = "../scivis-render" }
anyhow = { workspace = true }
bytemuck = { workspace = true }
log = { workspace = true }
# Parallel-across-slices 3D volume assembly. Gated with `threads` because rayon
# needs real threads to build, let alone run.
rayon = { workspace = true, optional = true }

# The plugin contract. Not target-gated: the browser build runs the built-in
# plugins too, through the registry here. Only the *loader* for third-party
# shared libraries is desktop-only — see `libloading` below.
fasttiff-plugin-api = { path = "../fasttiff-plugin-api" }
# The C ABI, and the crate that generates a plugin's side of it. Every target:
# the built-in plugins are registered through the same C contract a shared
# library is, in this process, so that a built-in and a library are one kind of
# plugin with one set of rules (`plugins/library.rs`). A browser has no
# `dlopen`, but it has `extern "C"` function pointers, which is all this needs.
# `fasttiff-plugin` is also where the `Registrar` the built-ins are handed in
# through is defined: the registry implements it.
fasttiff-plugin-abi = { path = "../fasttiff-plugin-abi" }
fasttiff-plugin = { path = "../fasttiff-plugin" }

# Desktop-only. Target-gated rather than put behind a feature: a `plugins`
# feature in `default` would silently vanish from the glow build, which is
# `--no-default-features` and is the Linux release backend — the binary would
# ship with no plugin support and CI would not notice, because that step only
# compiles. A `cfg(not(wasm32))` dependency cannot be forgotten.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Opening a shared library. Native only: there is no `dlopen` in a browser.
libloading = "0.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }
