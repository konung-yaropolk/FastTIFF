# The egui build of the FastTIFF viewer, running on a browser canvas.
#
# A workspace member. It used to be a workspace of its own, on the grounds that
# Cargo would otherwise union the desktop's `threads`/`mmap`/`codec-zstd` into
# the wasm build; resolver 2 does not, since the desktop crate asks for those
# only under `cfg(not(target_arch = "wasm32"))`. Being separate cost a second
# lockfile that no test ran against and Dependabot never saw.
#
# Built with the workspace's release profile. On wasm32-unknown-unknown
# `panic = "unwind"` has no effect (abort is the only strategy the target has),
# so the `panic = "abort"` this crate once set for itself changed nothing.
[package]
name = "fasttiff-web-egui"
version = "1.27.1"
edition = "2021"
description = "FastTIFF's egui interface, compiled to WebAssembly and drawn on a browser canvas."
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Which built-in plugins the bundle carries, forwarded one for one to the shared
# UI crate and from there to `fast-tiff-viewer`, where the list is documented.
# `wasm-pack build` passes no feature flags, so `default` is what ships; to trim
# the bundle, pass them through:
#
#     wasm-pack build --target web --release -- #         --no-default-features --features plugin-invert,plugin-zproject
#
# Worth doing only for the three that carry weight. `plugin-deconvolve` brings
# an FFT, and `plugin-suite2p-stabilize` and `plugin-turboreg-stabilize` a
# registration crate each; the others are their own code and little else.
[features]
default = ["builtin-plugins"]
builtin-plugins = ["fasttiff/builtin-plugins"]
plugin-invert = ["fasttiff/plugin-invert"]
plugin-zproject = ["fasttiff/plugin-zproject"]
plugin-plot-axis = ["fasttiff/plugin-plot-axis"]
plugin-stack-tools = ["fasttiff/plugin-stack-tools"]
plugin-animation-3d = ["fasttiff/plugin-animation-3d"]
plugin-crop = ["fasttiff/plugin-crop"]
plugin-suite2p-stabilize = ["fasttiff/plugin-suite2p-stabilize"]
plugin-turboreg-stabilize = ["fasttiff/plugin-turboreg-stabilize"]
plugin-deconvolve = ["fasttiff/plugin-deconvolve"]
plugin-png = ["fasttiff/plugin-png"]
# `plugin-oir`, `plugin-nifti`, `plugin-dicom` and `plugin-netpbm` are
# deliberately absent. All four are importers, and the importer lane is desktop-only: an `ImportRequest`
# carries a filesystem path, which a browser tab has none of. A switch here that
# could not turn anything on would only mislead.
plugins-none = ["fasttiff/plugins-none"]

# Every dependency is wasm-only, and so is the source (`src/lib.rs` is
# `#![cfg(target_arch = "wasm32")]`): on any other target this crate is empty,
# which is what lets `cargo test --workspace` include it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# The shared egui UI. `default-features = false` keeps the desktop-only feature
# set (threads / mmap / the C zstd codec) out of the wasm build; the renderer
# backend is selected explicitly.
# The package is `FastTIFF`; its library target is `fasttiff`, which is what
# `use fasttiff::…` resolves to.
fasttiff = { path = "../FastTIFF", package = "FastTIFF", default-features = false, features = ["renderer-wgpu"] }

eframe = { workspace = true, features = ["default_fonts", "wgpu"] }
egui = { workspace = true }

wasm-bindgen = { workspace = true }
# `#[wasm_bindgen]` on an async fn expands to code referencing this crate.
wasm-bindgen-futures = { workspace = true }
log = { workspace = true }
console_log = "1"
console_error_panic_hook = "0.1"
web-sys = { workspace = true, features = ["HtmlCanvasElement", "Window", "Document", "Element"] }

# There is deliberately no `[package.metadata.wasm-pack.profile.release]`
# `wasm-opt` block here, and it is worth saying why so that the next person
# debugging a wasm-opt failure does not add one.
#
# It looks like the fix: `wasm-bindgen` gives this module a second table (an
# `externref` table for the JS values Rust holds), a second table needs the
# `reference-types` feature, so tell `wasm-opt` to enable it. It is not the
# fix. The `wasm-opt` that broke the deploy was Binaryen 90, whose
# `readFunctionTableDeclaration` throws "Only 1 table definition allowed in
# MVP" unconditionally on any module with more than one table — the check is
# not feature-gated, and Binaryen 90 has no multi-table representation to fall
# back on. Multiple tables first became expressible in Binaryen 100. So no
# `--enable-` flag could have rescued it, and `--enable-multivalue` does not
# even exist in Binaryen 90: the block would have turned a confusing table
# error into a more confusing unknown-option error. Pinning the tool, in
# `deploy-web.yml`, is the fix.
#
# The block is also not additive. wasm-pack *replaces* its default argument
# vector with whatever is listed, and the release default is exactly `["-O"]`
# — so the optimisation level becomes one hand-maintained entry among what
# read as feature switches, and dropping it silently ships an unoptimised
# bundle.

