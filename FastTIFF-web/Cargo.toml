# The egui build of the FastTIFF viewer, running on a browser canvas.
#
# Standalone for the same reason as FastTIFF-web/crate: Cargo unifies features
# across a workspace, so one build covering this crate and the desktop app
# would union `threads`/`mmap`/`codec-zstd` back into the viewer and break the
# wasm build.
[workspace]

[package]
name = "fasttiff-web-egui"
version = "0.10.1"
edition = "2021"
description = "FastTIFF's egui interface, compiled to WebAssembly and drawn on a browser canvas."
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The shared egui UI. `default-features = false` keeps the desktop-only feature
# set (threads / mmap / the C zstd codec) out of the wasm build; the renderer
# backend is selected explicitly.
# The package is `FastTIFF`; its library target is `fasttiff`, which is what
# `use fasttiff::…` resolves to.
fasttiff = { path = "../FastTIFF", package = "FastTIFF", default-features = false, features = ["renderer-wgpu"] }

eframe = { version = "0.34", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.34"

wasm-bindgen = "0.2"
# `#[wasm_bindgen]` on an async fn expands to code referencing this crate.
wasm-bindgen-futures = "0.4"
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = ["HtmlCanvasElement", "Window", "Document", "Element"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
